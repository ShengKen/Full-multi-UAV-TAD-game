[tool.ruff]
line-length = 120
target-version = "py310"

extend-exclude = [
    "logs",
    "_isaac_sim",
    ".vscode",
    "_*",
    ".git",
]

[tool.ruff.lint]

select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "C90",

    "SIM",
    "RET",
]

ignore = [
    "E402",
    "D401",
    "RET504",
    "RET505",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM117",
    "SIM118",
    "UP006",
    "UP018",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]

section-order = [
    "future",
    "standard-library",
    "third-party",

    "omniverse-extensions",

    "isaaclab",
    "isaaclab-contrib",
    "isaaclab-rl",
    "isaaclab-mimic",
    "isaaclab-tasks",
    "isaaclab-assets",

    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]

"omniverse-extensions" = [
    "isaacsim",
    "omni",
    "pxr",
    "carb",
    "usdrt",
    "Semantics",
    "curobo",
]

"isaaclab" = ["isaaclab"]
"isaaclab-assets" = ["isaaclab_assets"]
"isaaclab-contrib" = ["isaaclab_contrib"]
"isaaclab-rl" = ["isaaclab_rl"]
"isaaclab-mimic" = ["isaaclab_mimic"]
"isaaclab-tasks" = ["isaaclab_tasks"]

[tool.ruff.format]

docstring-code-format = true

[tool.pyright]

include = ["source", "scripts"]
exclude = [
    "**/__pycache__",
    "**/_isaac_sim",
    "**/docs",
    "**/logs",
    ".git",
    ".vscode",
]

typeCheckingMode = "basic"
pythonVersion = "3.11"
pythonPlatform = "Linux"
enableTypeIgnoreComments = true

reportMissingImports = "none"

reportMissingModuleSource = "none"

reportGeneralTypeIssues = "none"
reportOptionalMemberAccess = "warning"
reportPrivateUsage = "warning"

[tool.codespell]
skip = '*.usd,*.usda,*.usdz,*.svg,*.png,_isaac_sim*,*.bib,*.css,*/_build'
quiet-level = 0

ignore-words-list = "haa,slq,collapsable,buss,reacher,thirdparty"

[tool.pytest.ini_options]

markers = [
    "isaacsim_ci: mark test to run in isaacsim ci",
]
